<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080c" />
    <meta name="color-scheme" content="dark light" />
    <!-- Runs before first paint: use the saved choice, otherwise the device setting. Prevents a theme flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dk-theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#07080c' : '#f5f6fa');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Official website of Doggy Kizz, Ugandan recording artist. Music, videos and bookings." />

    <meta property="og:site_name" content="Doggy Kizz" />
